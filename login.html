<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Energy Intelligence</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" style="text-decoration: none;">SECMS</a>
            
            <!-- CHANGED: Now using the 'nav-btn' class to match the index.html style perfectly -->
            <a href="index.html" class="nav-btn">Back Home</a>
        </div>
    </nav>

    <!-- Login Main Container -->
    <main class="login-wrapper">
        
        <div class="login-container">
            <!-- Left Side: Brand/Info (Purple Gradient) -->
            <div class="login-brand">
                <h2>SECMS Login</h2>
                <p>Log in to monitor your energy consumption, predict your next bill, and get personalized AI efficiency tips.</p>
                
                <!-- Decorative element to make the left side pop -->
                <div class="brand-decoration">
                    <div class="deco-icon">📊</div>
                </div>
            </div>

            <!-- Right Side: The Form (White) -->
            <div class="login-form-side">
                <div class="form-header">
                    <h1>Log In</h1>
                    <p>Enter your details to access your dashboard.</p>
                </div>

                <!-- Form Element -->
                <form action="dashboard.html" method="GET" class="login-form">
                    
                    <!-- Account Number Input -->
                    <div class="input-group">
                        <label for="account-number">Account Number</label>
                        <input type="text" id="account-number" name="account-number" placeholder="1234567890" required>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <div class="password-label-row">
                            <label for="password">Password</label>
                            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                        </div>
                        <div class="password-input-wrap">
                            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-controls="password" aria-pressed="false">
                                <svg data-eye-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg data-eye-off-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.8-.5"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="remember-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me for 30 days</label>
                    </div>

                    <!-- Submit Button -->
                    <p class="form-error" id="loginError" role="alert" hidden></p>
                    <button type="submit" class="submit-btn">Log In</button>
                </form>

                <div class="form-footer">
                    <!-- Changed href="#" to href="signup.html" -->
                    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
            </div>
        </div>

    </main>
    <script src="script/api.js"></script>
    <script src="script/login.js"></script>
    <script src="script/password-toggle.js"></script>

    <script src="script/theme.js"></script>
</body>
</html>
