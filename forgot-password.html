<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SECMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth-recovery.css">
</head>
<body>
    <nav class="navbar"><div class="nav-container">
        <a href="index.html" class="logo">SECMS</a>
        <a href="login.html" class="nav-btn">Back to login</a>
    </div></nav>
    <main class="login-wrapper">
        <div class="login-container auth-recovery-card">
            <section class="login-brand">
                <h2>Account recovery.</h2>
                <p>We’ll send you a secure, time-limited link to choose a new password.</p>
            </section>
            <section class="login-form-side">
                <div class="form-header">
                    <h1>Forgot password?</h1>
                    <p>Enter the email address connected to your SECMS account.</p>
                </div>
                <form id="forgotPasswordForm" novalidate>
                    <div class="input-group">
                        <label for="recoveryEmail">Email address</label>
                        <input id="recoveryEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
                    </div>
                    <p class="recovery-message" id="forgotPasswordMessage" role="status" aria-live="polite" hidden></p>
                    <div id="localResetLink" class="local-reset-link" hidden></div>
                    <button type="submit" class="submit-btn">Send reset link</button>
                </form>
                <div class="form-footer"><p>Remembered your password? <a href="login.html">Log in</a></p></div>
            </section>
        </div>
    </main>
    <script src="script/api.js"></script>
    <script src="script/theme.js"></script>
    <script src="script/forgot-password.js"></script>
</body>
</html>
