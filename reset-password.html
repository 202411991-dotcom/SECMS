<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SECMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth-recovery.css">
</head>
<body>
    <nav class="navbar"><div class="nav-container">
        <a href="index.html" class="logo">SECMS</a>
        <a href="login.html" class="nav-btn">Back to login</a>
    </div></nav>
    <main class="login-wrapper">
        <div class="login-container auth-recovery-card">
            <section class="login-brand">
                <h2>Choose a new password.</h2>
                <p>Reset links expire after 30 minutes and can only be used once.</p>
            </section>
            <section class="login-form-side">
                <div class="form-header">
                    <h1>Reset password</h1>
                    <p>Enter a new password with at least 8 characters.</p>
                </div>
                <form id="resetPasswordForm" novalidate>
                    <div class="input-group">
                        <label for="newPassword">New password</label>
                        <div class="password-input-wrap">
                            <input id="newPassword" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
                            <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-controls="newPassword" aria-pressed="false">
                                <svg data-eye-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg data-eye-off-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.8-.5"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Confirm new password</label>
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
                    </div>
                    <p class="recovery-message" id="resetPasswordMessage" role="status" aria-live="polite" hidden></p>
                    <button type="submit" class="submit-btn">Save new password</button>
                </form>
                <div class="form-footer"><p><a href="login.html">Return to login</a></p></div>
            </section>
        </div>
    </main>
    <script src="script/api.js"></script>
    <script src="script/theme.js"></script>
    <script src="script/password-toggle.js"></script>
    <script src="script/reset-password.js"></script>
</body>
</html>
